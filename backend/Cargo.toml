[package]
name = "backend"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-cookies = { version = "0.11", features = ["private"] }

# Database
diesel = { version = "2.3.8", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
diesel_migrations = "2.3.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI + config
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket (typed via ws-bridge)
ws-bridge = { version = "1.0.0", git = "https://github.com/meawoppl/ws-bridge", tag = "v1.0.0", features = ["server"] }

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Pre-compressed static frontend assets (brotli/gzip, ETag/304, SPA fallback).
memory-serve = "2.1"

# Workspace
shared = { path = "../shared" }
oauth2 = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
url = "2"
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }

unlinked-import = { path = "../crates/unlinked-import" }
unlinked-sim = { path = "../crates/unlinked-sim" }

unlinked-matlab = { path = "../crates/unlinked-matlab" }

[dev-dependencies]
tokio-tungstenite="0.24"
futures-util="0.3"

[build-dependencies]
memory-serve = "2.1"
